{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="padding: 4rem 1rem; background: linear-gradient(135deg, #f0f4f0 0%, #d8f3dc 100%); min-height: 80vh; display:flex; align-items:center; justify-content:center;">
  <div class="form-card" style="width:100%;">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <div style="font-size:3rem; margin-bottom:0.5rem;">⛰️</div>
      <h1 class="form-title">Welcome Back!</h1>
      <p class="form-sub">Login to continue your learning journey</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:0.5rem; font-size:1rem; padding:0.75rem;">
        🔐 Login
      </button>
    </form>
    <div style="text-align:center; margin-top:1.25rem; font-size:0.88rem; color:var(--stone);">
      Don't have an account? <a href="{% url 'register' %}" style="color:var(--pine);font-weight:700;">Register Free</a>
    </div>
    <div style="background:#f0f8f4;border-radius:10px;padding:0.85rem;margin-top:1.25rem;font-size:0.82rem;color:var(--pine);line-height:1.5;text-align:center;">
      📥 <strong>Offline Ready:</strong> Once logged in, download courses to study without internet!
    </div>
  </div>
</div>
{% endblock %}
